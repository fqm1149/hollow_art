<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 300px; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: #333; }
    .header { background: linear-gradient(135deg, #4CAF50, #2E7D32); color: white; padding: 16px; text-align: center; }
    .header h1 { font-size: 16px; }
    .header p { font-size: 12px; opacity: .8; margin-top: 4px; }
    .section { padding: 12px 16px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
    .row label { font-size: 14px; }
    .toggle { position: relative; width: 40px; height: 22px; background: #ddd; border-radius: 11px; cursor: pointer; transition: background .2s; }
    .toggle.on { background: #4CAF50; }
    .toggle::after { content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .toggle.on::after { transform: translateX(18px); }
    .ver { text-align: center; padding: 8px; font-size: 11px; color: #ccc; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌳 Hollow Art</h1>
    <p>v0.1.0 - 树洞重绘</p>
  </div>
  <div class="section">
    <div class="row">
      <label>启用新 UI</label>
      <div class="toggle on" id="enabled"></div>
    </div>
  </div>
  <div class="ver">Made with ❤️ for PKU</div>
</body>
</html>
